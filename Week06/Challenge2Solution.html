<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Shop Card</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
        background-color: #f3f4f6;
      }

      .shop-card {
        width: 360px;
        margin: 0 auto;
        background-color: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      }

      .image-box {
        background-color: #dbeafe;
        height: 180px;
        text-align: center;
        line-height: 180px;
        font-size: 28px;
        font-weight: bold;
        color: #1d4ed8;
      }

      .card-content {
        padding: 20px;
      }

      .card-content h2 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 28px;
        color: #111827;
      }

      .price {
        font-size: 22px;
        font-weight: bold;
        color: #059669;
        margin-bottom: 12px;
      }

      .rating {
        color: #f59e0b;
        font-size: 18px;
        margin-bottom: 14px;
      }

      .description {
        color: #4b5563;
        font-size: 16px;
        margin-bottom: 18px;
      }

      .buy-btn {
        display: inline-block;
        background-color: #2563eb;
        color: white;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="shop-card">
      <div class="image-box">Game Cover</div>

      <div class="card-content">
        <h2>Galaxy Fighters</h2>
        <div class="price">$19.99</div>
        <div class="rating">★★★★★</div>
        <p class="description">
          Battle through space missions, upgrade your ship, and defeat alien
          bosses.
        </p>
        <a href="#" class="buy-btn">Buy Game</a>
      </div>
    </div>
  </body>
</html>
