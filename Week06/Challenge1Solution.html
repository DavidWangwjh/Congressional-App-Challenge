<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow Quest</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #111827;
        color: white;
      }

      .hero {
        text-align: center;
        padding: 80px 20px;
        background: linear-gradient(to bottom, #1f2937, #111827);
      }

      .hero h1 {
        font-size: 52px;
        margin-bottom: 16px;
        color: #a78bfa;
      }

      .hero p {
        font-size: 20px;
        max-width: 700px;
        margin: 0 auto 30px auto;
        color: #d1d5db;
      }

      .button-group {
        margin-top: 20px;
      }

      .btn {
        display: inline-block;
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 10px;
        margin: 0 8px;
        font-size: 16px;
        font-weight: bold;
      }

      .btn-primary {
        background-color: #8b5cf6;
        color: white;
      }

      .btn-secondary {
        background-color: transparent;
        color: white;
        border: 2px solid white;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1>Shadow Quest</h1>
      <p>
        Enter a world of mystery, monsters, and magic. Build your hero and
        begin the ultimate adventure.
      </p>

      <div class="button-group">
        <a href="#" class="btn btn-primary">Play Now</a>
        <a href="#" class="btn btn-secondary">Watch Trailer</a>
      </div>
    </section>
  </body>
</html>
